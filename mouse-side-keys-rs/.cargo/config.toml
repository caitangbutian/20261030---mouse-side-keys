# 本文件刻意保持为空配置。
#
# 曾经在这里用 rustflags 全局设置子系统：
#     [target.x86_64-pc-windows-msvc]
#     rustflags = ["-C", "link-args=/SUBSYSTEM:WINDOWS"]
#
# 这是错的：rustflags 会作用于**所有**被编译的 crate，包括依赖的 build script。
# windows_x86_64_msvc 的构建脚本是控制台程序（入口 main），被强制要求 WinMain
# 入口后链接失败：
#     msvcrt.lib(exe_winmain.obj) : error LNK2019: unresolved external symbol WinMain
#     fatal error LNK1120: 1 unresolved externals
#
# 正确做法是在 src/main.rs 顶部用 crate 级属性（只作用于最终二进制）：
#     #![windows_subsystem = "windows"]
#
# 这里不再放任何 rustflags，以免再次误伤 build script。
